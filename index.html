<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation Generator</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #ffb347, #ffcc80);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .card {
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    .form-control {
      border-radius: 30px;
      padding: 12px;
      font-size: 16px;
    }

    .btn-custom {
      border-radius: 25px;
      padding: 10px;
      font-size: 16px;
    }

    .generate {
      background-color: #ff7a00;
      color: white;
    }

    .share {
      background-color: #25d366;
      color: white;
    }

    .link {
      font-size: 13px;
      word-break: break-all;
      margin-top: 10px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-6 col-lg-4">
      
      <div class="card text-center">

        <h4 class="text-warning mb-3">Wedding Invitation</h4>

        <!-- Input -->
        <input 
          type="text" 
          id="name" 
          class="form-control" 
          placeholder="Enter guest name"
        >

        <!-- Generate Button (Full Width initially) -->
        <button 
          class="btn btn-custom generate w-100 mt-3" 
          onclick="generateLink()">
          Generate Link
        </button>

        <!-- Result Section -->
        <div id="result" style="display:none;">

          <p id="linkText" class="link"></p>

          <!-- Buttons Side by Side -->
          <div class="row mt-2">
            <div class="col-6">
              <button 
                class="btn btn-custom generate w-100" 
                onclick="generateLink()">
                Regenerate
              </button>
            </div>

            <div class="col-6">
              <button 
                class="btn btn-custom share w-100" 
                onclick="shareLink()">
                Share
              </button>
            </div>
          </div>

        </div>

      </div>

    </div>
  </div>
</div>

<script>
  const baseUrl = "https://srinu-eswari-wedding-invitation.web.app";
  let generatedLink = "";

  function generateLink() {
    const name = document.getElementById("name").value.trim();
    if (!name) return;

    const encodedName = encodeURIComponent(name);
    generatedLink = baseUrl + "?n=" + encodedName;

    document.getElementById("linkText").innerText = generatedLink;
    document.getElementById("result").style.display = "block";
  }

  function shareLink() {
    const name = document.getElementById("name").value.trim();
    if (!generatedLink) return;

    const message = `Hi ${name},

You are warmly invited to the wedding of Srinu and Eswari on 24th June 2026.

Please use the link below to view the event details, including the time and venue:
${generatedLink}`;

    if (navigator.share) {
      navigator.share({
        title: "Wedding Invitation",
        text: message
        // url: generatedLink
      }).catch(err => console.log(err));
    } else {
      const whatsappUrl = "https://wa.me/?text=" + encodeURIComponent(message);
      window.open(whatsappUrl, '_blank');
    }
  }
</script>

</body>
</html>
